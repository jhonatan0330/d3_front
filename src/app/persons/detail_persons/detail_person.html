<div class="flex w-full flex-col">

    <!-- Header -->
    <div class="relative h-40 w-full bg-accent-100 px-1 dark:bg-accent-700 sm:h-48">
        <!-- Background -->
        <img class="absolute inset-0 h-full w-full object-cover" [src]="contact?.imagen" />

        <!-- Close button -->
        <div class="flex w-full items-center justify-end ">
            <a mat-icon-button (click)="cerrar()">
                <mat-icon class="text-white" [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
            </a>
        </div>
    </div>

    <!-- Contact -->
    <div class="relative flex flex-auto flex-col items-center p-6 pt-0 sm:p-12 sm:pt-0">

        <div class="w-full max-w-3xl">

            <!-- imagen and actions -->
            <div *ngIf="isSameUser" class="-mt-16 flex flex-auto items-end">
                <!-- imagen -->
                <div class="ring-bg-card flex h-32 w-32 items-center justify-center overflow-hidden">
                    <app-change-picture class="h-full w-full object-cover"></app-change-picture>
                </div>
            </div>

            <div *ngIf="!isSameUser" class="-mt-16 flex flex-auto items-end">
                <!-- imagen -->
                <div
                    class="ring-bg-card flex h-32 w-32 items-center justify-center overflow-hidden rounded-full ring-4">
                    <img *ngIf="contact.imagen" class="h-full w-full object-cover"
                        [src]="contact.imagen || defaultimagen" />
                    <div *ngIf="!contact.imagen"
                        class="flex h-full w-full items-center justify-center overflow-hidden rounded bg-gray-200 text-8xl font-bold uppercase leading-none text-gray-600 dark:bg-gray-700 dark:text-gray-200">
                        {{ contact.nombre?.charAt(0) }}
                    </div>
                </div>
            </div>

            <!-- Nombre -->
            <div class="mt-3 truncate text-4xl font-bold">
                {{ contact.nombre }}
            </div>

            <!-- Identificación -->
            <div class="mt-1 text-lg text-gray-600 dark:text-gray-300">
                ID: {{ contact?.identificacion }}
            </div>

            <div class="mt-4 flex flex-col space-y-4 border-t pt-6">


                <!-- Correo -->
                <div class="flex items-center">
                    <mat-icon [svgIcon]="'heroicons_outline:envelope'"></mat-icon>
                    <div class="ml-6 leading-6">
                        <a class="text-primary-500 hover:underline" [href]="'mailto:' + contact.correo">
                            {{ contact.correo }}
                        </a>
                    </div>
                </div>

                <!-- Teléfono -->
                <div class="flex items-center">
                    <mat-icon [svgIcon]="'heroicons_outline:phone'"></mat-icon>
                    <div class="ml-6 leading-6">
                        {{ contact.telefono }}
                    </div>
                </div>

                <!-- Roles -->
                <div class="mt-3 truncate text-4xl font-bold flex items-center gap-2">
                    Roles
                    <mat-icon [svgIcon]="'heroicons_outline:briefcase'" class="cursor-pointer" (click)="buscartags()">
                    </mat-icon>
                </div>


                <div class="overflow-x-auto whitespace-nowrap">
                    <div class="block pr-[10px] gap-2">
                        <div *ngFor="let tag of tags">
                            <button (click)="abrirRol(tag)" class="px-3">
                                <img *ngIf="tag.imagen" class="h-[30px] w-[30px] object-cover rounded-full"
                                    [src]="tag.imagen" alt="tag.nombre" />
                                {{ tag.nombre }}
                            </button>
                        </div>
                    </div>
                </div>


            </div>
        </div>
    </div>
</div>
