
    <div class=" w-full bg-white dark:bg-gray-900 rounded-xl shadow-lg p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-gray-200 dark:border-gray-700 pb-2">
        <h2 class="text-xl font-bold">{{ data.state?.llaveTabla ? 'Editar Estado' : 'Nuevo Estado' }}</h2>
        <button type="button" class="btn-icon" (click)="dialogRef.close()" aria-label="Cerrar" title="Cerrar"><mat-icon>close</mat-icon></button>
      </div>

      <form #form="ngForm" (ngSubmit)="onSubmit()">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold mb-1">Nombre *</label>
            <input type="text" [(ngModel)]="state.nombre" name="nombre" required class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-1">Tipo *</label>
              <mat-form-field appearance="outline" class="w-full"><mat-select [(ngModel)]="state.tipo" name="tipo" required><mat-option *ngFor="let op of tipoOpciones" [value]="op.value">{{ op.label }}</mat-option></mat-select></mat-form-field>
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">Estado Documento *</label>
              <mat-form-field appearance="outline" class="w-full"><mat-select [(ngModel)]="state.estadoDocumento" name="estadoDocumento" required><mat-option *ngFor="let op of estadoDocumentoOpciones" [value]="op.value">{{ op.label }}</mat-option></mat-select></mat-form-field>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-1">Código</label>
              <input type="text" [(ngModel)]="state.codigo" name="codigo" class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Se genera desde el nombre si está vacío" />
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">Avance</label>
              <input type="number" [(ngModel)]="state.avance" name="avance" min="0" class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">Proceso</label>
            <input type="text" [ngModel]="state.procesoNombre || data.process?.nombre" name="procesoNombre" readonly class="w-full border border-gray-200 dark:border-gray-700 rounded px-3 py-2 bg-gray-50 dark:bg-gray-800 text-gray-500 dark:text-gray-400" />
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
          <button type="button" class="btn-flat" (click)="openPropiedades()" [disabled]="!state.llaveTabla"><mat-icon>tune</mat-icon> Propiedades</button>
          <button type="button" class="btn-flat" (click)="dialogRef.close()">Cancelar</button>
          <button type="submit" class="btn-flat-primary" [disabled]="cargando || !form.valid">{{ cargando ? 'Guardando...' : (data.state?.llaveTabla ? 'Actualizar' : 'Crear') }}</button>
        </div>
      </form>
    </div>
