
    <div class="bg-white dark:bg-gray-900 rounded-xl shadow-lg max-w-5xl w-full max-h-[95vh] overflow-hidden flex flex-col">
      <div class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-700">
        <h2 class="text-xl font-bold">{{ data?.id ? 'Editar Proceso' : 'Nuevo Proceso' }}</h2>
        <button type="button" class="btn-icon" (click)="dialogRef.close()"><mat-icon>close</mat-icon></button>
      </div>

      <form #form="ngForm" (ngSubmit)="onSubmit()" class="flex flex-col min-h-0 overflow-hidden">
        <mat-tab-group class="min-h-0 overflow-hidden" [selectedIndex]="activeTab()">
          <!-- Tab General -->
          <mat-tab label="General">
            <div class="p-4 h-full overflow-y-auto space-y-4">
              <div class="grid grid-cols-1 gap-6 lg:grid-cols-[160px_minmax(0,1fr)]">
                <div class="flex flex-col">
                  <label class="form-label mb-2">Imagen</label>
                  <div class="w-full max-w-[160px]">
                    <app-image-uploader [(value)]="process.imagen"></app-image-uploader>
                  </div>
                </div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                  <div class="sm:col-span-2">
                    <label class="form-label">Nombre *</label>
                    <input type="text" [(ngModel)]="process.nombre" name="nombre" required class="form-input" />
                  </div>
                  <div>
                    <label class="form-label">Código *</label>
                    <input type="text" [(ngModel)]="process.codigo" name="codigo" required class="form-input" />
                  </div>
                  <div>
                    <label class="form-label">Tipo *</label>
                    <select [(ngModel)]="process.tipo" name="tipo" required class="form-select">
                      <option value="A">Agrupador</option>
                      <option value="E">Ejecutor</option>
                    </select>
                  </div>
                  <div>
                    <label class="form-label">Prioridad</label>
                    <input type="number" [(ngModel)]="process.prioridad" name="prioridad" class="form-input" />
                  </div>
                  <div>
                    <label class="form-label">Macro Proceso</label>
                    <app-process-selector [(ngModel)]="process.nodoSuperior" name="nodoSuperior" label=""></app-process-selector>
                  </div>
                  <div class="sm:col-span-2">
                    <label class="form-label">Macro Nombre</label>
                    <input type="text" [(ngModel)]="process.nodoSuperiorNombre" name="nodoSuperiorNombre" class="form-input" />
                  </div>
                </div>
              </div>
            </div>
          </mat-tab>

          <!-- Tab Estados -->
          <mat-tab label="Estados ">
            <div class="p-4 h-full">
              <app-process-state-list
                [processKey]="process.llaveTabla">
              </app-process-state-list>
            </div>
          </mat-tab>

          <!-- Tab Transiciones -->
          <mat-tab label="Transiciones">
            <div class="p-4 h-full">
              <app-process-transition-list
                [processKey]="process.llaveTabla">
              </app-process-transition-list>
            </div>
          </mat-tab>

        </mat-tab-group>

        <div class="flex justify-end gap-3 p-4 border-t border-gray-200 dark:border-gray-700">
          <button type="button" class="btn-flat" (click)="openPropiedades()" [disabled]="!process.llaveTabla"><mat-icon>tune</mat-icon> Propiedades</button>
          <button type="button" class="btn-flat" (click)="dialogRef.close()">Cancelar</button>
          <button type="submit" class="btn-flat-primary" [disabled]="cargando || !form.valid">{{ cargando ? 'Guardando...' : (data?.id ? 'Actualizar' : 'Crear') }}</button>
        </div>
      </form>
    </div>
