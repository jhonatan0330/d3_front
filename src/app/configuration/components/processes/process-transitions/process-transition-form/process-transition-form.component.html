
    <div class=" w-full bg-white dark:bg-gray-900 rounded-xl shadow-lg p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-gray-200 dark:border-gray-700 pb-2">
        <h2 class="text-xl font-bold">{{ esEdicion ? 'Editar Transición' : 'Nueva Transición' }}</h2>
        <button type="button" class="btn-icon" (click)="dialogRef.close()" aria-label="Cerrar" title="Cerrar"><mat-icon>close</mat-icon></button>
      </div>

      <form #form="ngForm" (ngSubmit)="onSubmit()">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold mb-1">Nombre *</label>
            <input type="text" [(ngModel)]="transition.nombre" name="nombre" required maxlength="100" class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>

          @if (!esEdicion) {
            <div>
              <label class="block text-sm font-semibold mb-1">Proceso *</label>
              <app-process-selector
                name="proceso"
                [(ngModel)]="transition.proceso"
                (ngModelChange)="onProcessChange($event)"
                required
                label=""
                placeholder="Buscar proceso..." />
            </div>
          } @else {
            <div>
              <label class="block text-sm font-semibold mb-1">Proceso</label>
              <input type="text" [ngModel]="transition.procesoNombre || transition.proceso" name="procesoNombre" readonly class="w-full border border-gray-200 dark:border-gray-700 rounded px-3 py-2 bg-gray-50 dark:bg-gray-800 text-gray-500 dark:text-gray-400" />
            </div>
          }

          <div>
            <label class="block text-sm font-semibold mb-1">Estado Origen</label>
            <app-state-selector
              name="estadoPartida"
              [(ngModel)]="transition.estadoPartida"
              [processKey]="processKey"
              label=""
              placeholder="Buscar estado origen..." />
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">Plantilla</label>
            <div class="flex gap-2">
              <div class="flex-1">
                <app-template-selector
                  name="plantilla"
                  [(ngModel)]="transition.plantilla"
                  label=""
                  placeholder="Buscar plantilla..." />
              </div>
              <button type="button" class="btn-flat self-end" (click)="abrirPlantilla()" [disabled]="!transition.plantilla" title="Abrir plantilla">
                <mat-icon>description</mat-icon>
              </button>
            </div>
          </div>


          <div>
            <label class="block text-sm font-semibold mb-1">Estado Destino</label>
            <app-state-selector
              name="estadoLLegada"
              [(ngModel)]="transition.estadoLLegada"
              [processKey]="processKey"
              label=""
              placeholder="Buscar estado destino..." />
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
          <button type="button" class="btn-flat" (click)="openPropiedades()" [disabled]="!transition.llaveTabla"><mat-icon>tune</mat-icon> Propiedades</button>
          <button type="button" class="btn-flat" (click)="dialogRef.close()">Cancelar</button>
          <button type="submit" class="btn-flat-primary" [disabled]="cargando || !form.valid">{{ cargando ? 'Guardando...' : (esEdicion ? 'Actualizar' : 'Crear') }}</button>
        </div>
      </form>
    </div>
