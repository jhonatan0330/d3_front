<div class="w-full bg-white dark:bg-gray-900 rounded-xl shadow-lg p-6 space-y-4 max-h-[90vh] flex flex-col overflow-hidden">
  <div class="flex items-center justify-between border-b border-gray-200 dark:border-gray-700 pb-2">
    <h2 class="text-xl font-bold">{{ titulo }}</h2>
    <button type="button" class="btn-icon" (click)="dialogRef.close()" aria-label="Cerrar" title="Cerrar">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form #form="ngForm" (ngSubmit)="onSubmit()" class="flex-1 overflow-y-auto">
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1">Nombre *</label>
        <input type="text" [(ngModel)]="target.nombre" name="nombre" required class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">Valor inferior</label>
        <input type="number" [(ngModel)]="target.valorInferior" name="valorInferior" class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500" step="any" />
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">Valor superior</label>
        <input type="number" [(ngModel)]="target.valorSuperior" name="valorSuperior" class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500" step="any" />
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">Color</label>
        <div class="flex items-center gap-2">
          <input type="color" class="h-10 w-12 cursor-pointer rounded-lg border border-gray-300 bg-transparent p-1 dark:border-gray-700" [(ngModel)]="target.color" name="color" />
          <input type="text" class="w-full border border-gray-300 dark:border-gray-600 rounded px-3 py-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500" [(ngModel)]="target.color" name="colorHex" placeholder="#64748b" />
        </div>
      </div>


    </div>

    <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
      <button type="button" class="btn-flat" (click)="dialogRef.close()">Cancelar</button>
      <button type="submit" class="btn-flat-primary" [disabled]="cargando || !form.valid">
        {{ cargando ? 'Guardando...' : (target.key ? 'Actualizar' : 'Crear') }}
      </button>
    </div>
  </form>
</div>
