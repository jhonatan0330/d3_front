
    <div class=" w-full bg-white dark:bg-gray-900 rounded-xl shadow-lg p-6 space-y-4 max-h-[90vh] flex flex-col overflow-hidden">
      <div class="flex items-center justify-between border-b border-gray-200 dark:border-gray-700 pb-2">
        <h2 class="text-xl font-bold">{{ data?.id ? 'Editar Tarea Automática' : 'Nueva Tarea Automática' }}</h2>
        <button type="button" class="btn-icon" (click)="dialogRef.close()" aria-label="Cerrar" title="Cerrar"><mat-icon>close</mat-icon></button>
      </div>

      <form #form="ngForm" (ngSubmit)="onSubmit()" class="flex-1 overflow-y-auto">
        <div class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="form-label">Fecha *</label>
              <input type="date" [(ngModel)]="task.fecha" name="fecha" required class="form-input" />
            </div>
            <div>
              <label class="form-label">Transición</label>
              <input type="text" [(ngModel)]="task.transicion" name="transicion" class="form-input" placeholder="Llave de la transición" />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-1">Plantilla</label>
              <input type="text" [(ngModel)]="task.plantilla" name="plantilla" class="form-input" placeholder="Llave de la plantilla" />
            </div>
            <div>
              <label class="form-label">Plantilla Nombre</label>
              <input type="text" [(ngModel)]="task.plantillaNombre" name="plantillaNombre" class="form-input" />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="form-label">Propiedad</label>
              <input type="text" [(ngModel)]="task.propiedad" name="propiedad" class="form-input" placeholder="Llave de la propiedad" />
            </div>
            <div>
              <label class="form-label">Ejecución</label>
              <input type="text" [(ngModel)]="task.ejecucion" name="ejecucion" class="form-input font-mono" />
            </div>
          </div>

          <div>
            <label class="form-label">Mensaje</label>
            <textarea [(ngModel)]="task.mensaje" name="mensaje" rows="3" class="form-textarea" placeholder="Mensaje de la tarea"></textarea>
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
          <button type="button" class="btn-flat" (click)="dialogRef.close()">Cancelar</button>
          <button type="submit" class="btn-flat-primary" [disabled]="cargando || !form.valid">{{ cargando ? 'Guardando...' : (data?.id ? 'Actualizar' : 'Crear') }}</button>
        </div>
      </form>
    </div>
