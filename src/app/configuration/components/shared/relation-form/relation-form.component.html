
<form #form="ngForm" class="flex max-h-[90vh] w-full min-w-0 flex-col overflow-hidden bg-card" (ngSubmit)="onSubmit()">
  <header class="flex shrink-0 items-start justify-between gap-4 border-b border-gray-200 px-5 py-4 dark:border-gray-700 sm:px-6">
    <div class="min-w-0">
      <p class="text-xs font-semibold uppercase text-secondary">Relaciones de propiedad</p>
      <h2 class="mt-1 text-xl font-semibold leading-tight">
        {{ data.relacion?.llaveTabla ? 'Editar relación' : 'Nueva relación' }}
      </h2>
      <p class="mt-1 text-sm text-secondary">Vincula un campo con una plantilla.</p>
    </div>
    <button type="button" class="btn-icon shrink-0" (click)="dialogRef.close()" aria-label="Cerrar" title="Cerrar">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="min-h-0 flex-1 space-y-5 overflow-y-auto px-5 py-5 sm:px-6">
    <div>
      <label class="mb-1.5 block text-sm font-medium" for="relation-field">Campo</label>
      <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
        <mat-select id="relation-field" [(ngModel)]="relacion.campo" name="campo" required>
          @for (c of camposDisponibles; track c.llaveTabla) {
            <mat-option [value]="c.llaveTabla">{{ c.nombre }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <div>
      <label class="mb-1.5 block text-sm font-medium" for="relation-template">Plantilla</label>
      <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
        <mat-select id="relation-template" [(ngModel)]="relacion.plantilla" name="plantilla" required>
          @for (p of plantillasDisponibles; track p.llaveTabla) {
            <mat-option [value]="p.llaveTabla">{{ p.nombre }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <div>
      <label class="mb-1.5 block text-sm font-medium" for="relation-auxiliary">Auxiliar</label>
      <input id="relation-auxiliary" type="text"
        [(ngModel)]="relacion.auxiliar"
        name="auxiliar"
        class="w-full rounded-md border border-gray-300 bg-white px-3 py-2.5 text-gray-900 outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100" />
    </div>

    <div>
      <label class="mb-1.5 block text-sm font-medium" for="relation-start-date">Fecha de inicio</label>
      <input id="relation-start-date" type="date"
        [(ngModel)]="relacion.fechaInicio"
        name="fechaInicio"
        class="w-full rounded-md border border-gray-300 bg-white px-3 py-2.5 text-gray-900 outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100" />
    </div>
  </div>

  <footer class="flex shrink-0 justify-end gap-3 border-t border-gray-200 bg-gray-50 px-5 py-4 dark:border-gray-700 dark:bg-gray-800/60 sm:px-6">
    <button type="button" class="btn-raised" (click)="dialogRef.close()">Cancelar</button>
    <button type="submit" class="btn-flat-primary" [disabled]="cargando || !form.valid">
      <mat-icon>{{ cargando ? 'hourglass_top' : 'save' }}</mat-icon>
      <span>{{ cargando ? 'Guardando...' : 'Guardar' }}</span>
    </button>
  </footer>
</form>
