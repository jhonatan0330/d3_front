<section class="flex flex-col overflow-hidden rounded-2xl border border-neutral-100 bg-white shadow-sm dark:border-neutral-800 dark:bg-neutral-900">
  <header class="flex items-center gap-3 border-b border-neutral-100 px-5 py-4 dark:border-neutral-800">
    <img class="h-9 w-9 shrink-0 rounded-full object-cover" src="assets/images/assistant.gif" alt="Asistente">
    <h2 class="truncate text-base font-semibold">Última conversación con el asistente</h2>
  </header>

  @if (hasConversation()) {
    <div class="flex min-h-0 flex-1 flex-col gap-3 px-5 py-4">
      @if (lastUserMessage(); as userMsg) {
        <div class="flex justify-end">
          <p class="max-w-[85%] break-words rounded-2xl rounded-br-sm bg-primary/10 px-3.5 py-2 text-sm text-neutral-800 dark:text-neutral-200">
            {{ userMsg.text }}
          </p>
        </div>
      }
      @if (lastAssistantReply(); as reply) {
        <div class="flex justify-start">
          <p class="max-w-[85%] break-words rounded-2xl rounded-bl-sm bg-neutral-100 px-3.5 py-2 text-sm dark:bg-neutral-800">
            {{ reply.text }}
          </p>
        </div>
      }
      <button type="button" (click)="openAssistant()"
        class="mt-2 inline-flex items-center justify-center gap-2 self-start rounded-full bg-primary px-4 py-2 text-sm font-medium text-white transition hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-primary/40">
        <mat-icon class="!text-[18px]">open_in_new</mat-icon>
        Continuar conversación
      </button>
    </div>
  } @else {
    <div class="flex flex-1 flex-col items-center gap-4 px-5 py-10 text-center">
      <p class="text-sm text-secondary">Aún no has conversado con el asistente. ¡Pregúntale lo que necesites!</p>
      <button type="button" (click)="openAssistant()"
        class="inline-flex items-center justify-center gap-2 rounded-full bg-primary px-5 py-2.5 text-sm font-medium text-white transition hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-primary/40">
        <mat-icon class="!text-[18px]">chat</mat-icon>
        Abrir asistente
      </button>
    </div>
  }
</section>
