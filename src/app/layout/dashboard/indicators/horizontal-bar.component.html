<article class="flex flex-col rounded-xl border border-neutral-100 bg-white p-4 dark:border-neutral-800 dark:bg-neutral-900">
  <ul class="divide-y divide-neutral-50 dark:divide-neutral-800">
    @for (item of items(); track item.nombre) {
      <li class="py-3">
        <div class="flex items-center justify-between gap-3 mb-1">
          <span class="text-sm text-neutral-700 dark:text-neutral-300">{{ item.nombre }}</span>
          <span class="text-sm font-medium text-neutral-500 dark:text-neutral-400">{{ item.pct }}%</span>
        </div>
        <div class="w-full h-2 bg-neutral-200 rounded overflow-hidden dark:bg-neutral-800">
          <div
            class="h-full"
            [style.backgroundColor]="item.color"
            [style.width.%]="item.pct"
          ></div>
        </div>
        <span class="text-xs text-neutral-500 dark:text-neutral-400">{{ item.unidades }} Unidades</span>
      </li>
    }
  </ul>
</article>
