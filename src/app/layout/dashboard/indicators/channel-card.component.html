<article class="flex flex-col rounded-xl border border-neutral-100 bg-white p-4 dark:border-neutral-800 dark:bg-neutral-900">
  <div class="flex items-center gap-2 mb-1">
    <span class="flex h-7 w-7 items-center justify-center rounded-lg bg-primary/10 text-primary">
      {{ canal().icono }}
    </span>
    <h3 class="text-sm font-semibold text-neutral-900 dark:text-white">{{ canal().nombre }}</h3>
  </div>
  <div class="text-2xl font-bold tabular-nums text-neutral-900 dark:text-white">
    {{ canal().valor | number }}
  </div>
  <p class="mt-1 text-xs text-neutral-500 dark:text-neutral-400">
    {{ canal().pctTotal }}% del total
  </p>
</article>
