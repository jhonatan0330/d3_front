<section class="relative overflow-hidden border border-white/40 bg-[radial-gradient(circle_at_top_left,rgba(59,130,246,0.18),transparent_30%),linear-gradient(135deg,rgba(15,23,42,0.96),rgba(30,41,59,0.94),rgba(17,24,39,0.98))] p-4 shadow-[0_18px_50px_rgba(15,23,42,0.22)] ring-1 ring-slate-200/40 sm:p-6 dark:ring-slate-700/50">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(14,124,123,0.25),transparent_35%)]"></div>

  <div class="relative mb-5 flex items-center justify-between gap-3">
    <div>
      <p class="text-[10px] font-semibold uppercase tracking-[0.22em] text-sky-200/80">
        Acceso rápido
      </p>
      <h2 class="mt-1 text-xl font-semibold text-white">
        Herramientas de gestión rápida
      </h2>
    </div>
    <span class="inline-flex items-center rounded-full border border-white/15 bg-white/10 px-2.5 py-1 text-[11px] font-medium text-slate-100 backdrop-blur-sm">
      {{ acciones().length }} opciones
    </span>
  </div>

  <div class="relative grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-4">
    @for (accion of acciones(); track accion.id) {
      <div class="group relative flex h-full items-center overflow-hidden rounded-2xl border border-white/10 bg-white/7 text-white shadow-[0_10px_20px_rgba(15,23,42,0.18)] backdrop-blur-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-sky-300/40 hover:bg-white/10 dark:border-slate-700/60 dark:bg-slate-900/40">
        <button
          type="button"
          class="flex flex-1 items-center gap-3 p-3 text-left"
          (click)="onAction(accion)"
        >
          @if (accion.icono.startsWith('http') || accion.icono.startsWith('/') || accion.icono.startsWith('www')) {
            <span class="flex h-11 w-11 shrink-0 items-center justify-center overflow-hidden shadow-sm">
              <img
                class="h-full w-full object-cover"
                [src]="accion.icono | imageFormat"
                [alt]="accion.nombre"
                (error)="$any($event.target).src = 'assets/images/logo/dark_264x264.png'"
              />
            </span>
          } @else {
            <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-gradient-to from-sky-400 to-cyan-500 text-base font-semibold text-white shadow-sm transition-transform duration-200 group-hover:scale-[1.03]">
              {{ accion.icono }}
            </span>
          }
          <span class="min-w-0 text-sm font-medium text-slate-100">
            {{ accion.nombre }}
          </span>
        </button>

        <button
          type="button"
          class="absolute right-2 top-2 inline-flex h-8 w-8 items-center justify-center rounded-xl border border-sky-200/30 bg-sky-500/20 text-base font-semibold text-sky-100 shadow-[0_8px_16px_rgba(14,116,144,0.25)] transition-all duration-200 hover:scale-105 hover:bg-sky-500/30 hover:text-white"
          [attr.aria-label]="'Abrir ' + accion.nombre + ' en la lista'"
          (click)="onOpenList(accion); $event.stopPropagation()"
          title="Abrir en la lista"
        >
          ↗
        </button>
      </div>
    }
  </div>
</section>
