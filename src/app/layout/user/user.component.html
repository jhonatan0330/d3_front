<app-dropdown>
  <!-- Button trigger -->
  <button class="btn-icon" trigger>
    <span class="relative flex h-7 w-7 items-center justify-center overflow-hidden rounded-full bg-gray-200 text-sm font-semibold uppercase text-gray-600 dark:bg-gray-700 dark:text-gray-200">
      <span>{{ userInitial() }}</span>
      @if (hasImage()) {
        <img class="absolute inset-0 h-full w-full rounded-full object-cover" [src]="layoutService.user().imagen" (error)="onImageError($event)" alt="Avatar de usuario">
      }
    </span>
  </button>

  <!-- User info -->
  <div class="flex flex-col items-center justify-center px-4 py-3 leading-none text-center">
    <span>Authenticado como</span>
    <span class="mt-1.5 text-md font-medium">{{layoutService.user().identificacion}}</span>
    <span class="mt-1.5 text-md font-medium">{{layoutService.user().nombre}}</span>
    <span class="text-xs">{{ currentApplicationVersion }}</span>
  </div>

  <!-- Divider -->
  <div class="my-2 border-t border-gray-200 dark:border-gray-700"></div>

  <!-- Menu items -->
  <app-dropdown-item (clicked)="goToMyAccount(layoutService.user())">
    <mat-icon [svgIcon]="'heroicons_outline:cog'"></mat-icon>
    <span>Mi cuenta</span>
  </app-dropdown-item>
  <app-dropdown-item (clicked)="getRefreshTemplates('USER')">
    <mat-icon [svgIcon]="'heroicons_outline:arrow-path'"></mat-icon>
    <span>Cargar de nuevo</span>
  </app-dropdown-item>
  @if (layoutService.isAdmin()) {
    <app-dropdown-item (clicked)="getRefreshTemplates('ADMIN')">
      <mat-icon [svgIcon]="'heroicons_outline:shield-check'"></mat-icon>
      <span>Administrador</span>
    </app-dropdown-item>
  }
  @if (layoutService.isReader()) {
    <app-dropdown-item (clicked)="getRefreshTemplates('READER')">
      <mat-icon [svgIcon]="'heroicons_outline:shield-check'"></mat-icon>
      <span>Auditor</span>
    </app-dropdown-item>
  }
  <app-dropdown-item (clicked)="cambiarClave()">
    <mat-icon [svgIcon]="'heroicons_outline:key'"></mat-icon>
    <span>Cambiar clave de acceso</span>
  </app-dropdown-item>

  <!-- Divider -->
  <div class="my-2 border-t border-gray-200 dark:border-gray-700"></div>

  <app-dropdown-item (clicked)="signOut()">
    <mat-icon [svgIcon]="'heroicons_outline:arrow-right-on-rectangle'"></mat-icon>
    <span>Salir</span>
  </app-dropdown-item>
</app-dropdown>
