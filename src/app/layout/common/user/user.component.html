<app-dropdown>
  <!-- Button trigger -->
  <button class="btn-icon" trigger>
    <span class="relative">
      @if (user.imagen) {
        <img class="w-7 h-7 rounded-full" [src]="user.imagen">
      }
      @if (!user.imagen) {
        <mat-icon [svgIcon]="'heroicons_outline:user-circle'"></mat-icon>
      }
    </span>
  </button>

  <!-- User info -->
  <div class="flex flex-col items-center justify-center px-4 py-3 leading-none text-center">
    <span>Authenticado como</span>
    <span class="mt-1.5 text-md font-medium">{{user.identificacion}}</span>
    <span class="mt-1.5 text-md font-medium">{{user.nombre}}</span>
    <span class="text-xs">{{ currentApplicationVersion }}</span>
  </div>

  <!-- Divider -->
  <div class="my-2 border-t border-gray-200 dark:border-gray-700"></div>

  <!-- Menu items -->
  <app-dropdown-item (clicked)="goToMyAccount(user)">
    <mat-icon [svgIcon]="'heroicons_outline:cog'"></mat-icon>
    <span>Mi cuenta</span>
  </app-dropdown-item>
  <app-dropdown-item (clicked)="getRefreshTemplates('USER')">
    <mat-icon [svgIcon]="'heroicons_outline:arrow-path'"></mat-icon>
    <span>Cargar de nuevo</span>
  </app-dropdown-item>
  @if (jwtAuth.isAdmin) {
    <app-dropdown-item (clicked)="getRefreshTemplates('ADMIN')">
      <mat-icon [svgIcon]="'heroicons_outline:shield-check'"></mat-icon>
      <span>Administrador</span>
    </app-dropdown-item>
  }
  @if (jwtAuth.isReader) {
    <app-dropdown-item (clicked)="getRefreshTemplates('READER')">
      <mat-icon [svgIcon]="'heroicons_outline:shield-check'"></mat-icon>
      <span>Auditor</span>
    </app-dropdown-item>
  }
  <app-dropdown-item (clicked)="cambiarClave()">
    <mat-icon [svgIcon]="'heroicons_outline:key'"></mat-icon>
    <span>Cambiar clave de acceso</span>
  </app-dropdown-item>

  <!-- Divider -->
  <div class="my-2 border-t border-gray-200 dark:border-gray-700"></div>

  <app-dropdown-item (clicked)="signOut()">
    <mat-icon [svgIcon]="'heroicons_outline:arrow-right-on-rectangle'"></mat-icon>
    <span>Salir</span>
  </app-dropdown-item>
</app-dropdown>
