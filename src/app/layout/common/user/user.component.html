<!-- Button -->
<button mat-icon-button [matMenuTriggerFor]="userActions" *ngIf="!jwtAuth.isPublicUser"> 
    <span class="relative">
        <img class="w-7 h-7 rounded-full" *ngIf="user?.imagen" [src]="user?.imagen">
        <mat-icon *ngIf="!user?.imagen" [svgIcon]="'heroicons_outline:user-circle'"></mat-icon>
    </span>
</button>

<button *ngIf="jwtAuth.isPublicUser" mat-icon-button (click)="openLogin()">
    <mat-icon [svgIcon]="'heroicons_outline:user-circle'"></mat-icon>
  </button>
  
<mat-menu [xPosition]="'before'" #userActions="matMenu">
    <button mat-menu-item class="flex flex-col items-center justify-center leading-none text-center">
        <span class="flex flex-col items-center justify-center leading-none text-center">
            <span>Authenticado como</span>
            <span class="mt-1.5 text-md font-medium">{{user?.correo}}</span>
        </span>             
    </button>
    <mat-divider class="my-2"></mat-divider>
    <button mat-menu-item (click)="goToMyAccount()">
        <mat-icon [svgIcon]="'heroicons_outline:cog'"></mat-icon>
        <span>Mi cuenta</span>
    </button>
    <button mat-menu-item (click)="getRefreshTemplates()">
        <mat-icon [svgIcon]="'heroicons_outline:arrow-path'"></mat-icon>
        <span>Cargar de nuevo</span>
    </button>
    <button mat-menu-item *ngIf="jwtAuth.isAdmin" (click)="getFullTemplates()">
        <mat-icon [svgIcon]="'heroicons_outline:shield-check'"></mat-icon>
        <span>Administrador</span>
    </button>
    <button mat-menu-item (click)="downloadApk()">
        <mat-icon [svgIcon]="'heroicons_outline:device-phone-mobile'"></mat-icon>
        <span>Version Android</span>
    </button>
    <mat-divider class="my-2"></mat-divider>
    <button mat-menu-item (click)="signOut()">
        <mat-icon [svgIcon]="'heroicons_outline:arrow-right-on-rectangle'"></mat-icon>
        <span>Salir</span>
    </button>
    <div
        class="absolute bottom-0 left-1/2 transform -translate-x-1/2 text-gray-500 text-xxs leading-none whitespace-nowrap">
        {{ time | date : "medium" }} - {{ currentApplicationVersion }}
    </div>
</mat-menu>
