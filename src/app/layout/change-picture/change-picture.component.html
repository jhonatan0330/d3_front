<div class="relative flex h-full w-full items-center justify-center">
  <app-image-uploader
    [avatar]="true"
    [value]="imagen"
    (valueChange)="onChanged($event)">
  </app-image-uploader>

  @if (submitted) {
    <div class="absolute bottom-1 left-0 right-0 z-20 px-4">
      <div class="w-full h-1 bg-gray-200 dark:bg-gray-700 rounded overflow-hidden">
        <div class="h-full bg-primary rounded animate-pulse" style="width: 40%;"></div>
      </div>
    </div>
  }
</div>
