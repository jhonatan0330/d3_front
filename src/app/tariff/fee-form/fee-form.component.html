<div class="flex flex-col max-w-240 md:min-w-160 max-h-screen ">
    <div class="flex flex-0 items-center justify-between h-16 pr-3 sm:pr-5 pl-6 sm:pl-8 bg-primary text-on-primary">
        <div class="text-lg font-medium">Tarifa</div>
        <button mat-icon-button (click)="matDialogRef.close()" [tabIndex]="-1">
            <mat-icon class="text-current">close</mat-icon>
        </button>
    </div>
    <form class="p-6 sm:p-8" [formGroup]="form">
        <mat-form-field class="w-full">
            <mat-label>Producto</mat-label>
            <input matInput [formControlName]="'producto'"> 
        </mat-form-field>
        <mat-form-field class="w-full">
            <mat-label>Dimension 1</mat-label>
            <input matInput [formControlName]="'recurso'" >
        </mat-form-field>
        <mat-form-field class="w-full">
            <mat-label>Dimension 2</mat-label>
            <input matInput [formControlName]="'dimension2'"> 
        </mat-form-field>
        <mat-form-field class="w-full">
            <mat-label>Dimension 3</mat-label>
            <input matInput [formControlName]="'dimension3'">
        </mat-form-field>
        <mat-form-field class="w-full">
            <mat-label>Dimension 4</mat-label>
            <input matInput [formControlName]="'dimension4'">
        </mat-form-field>
        <div class="w-full gap-1 sm:justify-between sm:flex">
            <mat-form-field class="w-full">
                <mat-label>Cantidad Minima</mat-label>
                <input matInput [formControlName]="'cantidadMinima'" type="number" >
            </mat-form-field>
            <mat-form-field class="w-full">
                <mat-label>Cantidad Maxima</mat-label>
                <input matInput [formControlName]="'cantidadMaxima'" type="number" >
            </mat-form-field>
        </div>
        <div class="w-full gap-1 sm:justify-between sm:flex">
            <mat-form-field class="w-full">
                <mat-label>Valor minimo</mat-label>
                <input matInput [formControlName]="'valorMinimo'" type="number" >
            </mat-form-field>
            <mat-form-field class="w-full">
                <mat-label>Valor</mat-label>
                <input matInput [formControlName]="'valor'" type="number" >
            </mat-form-field>
            <mat-form-field class="w-full">
                <mat-label>Valor Maximo</mat-label>
                <input matInput [formControlName]="'valorMaximo'" type="number" >
            </mat-form-field>
            <mat-form-field class="w-full">
                <mat-label>Total Minimo</mat-label>
                <input matInput [formControlName]="'totalMinimo'" type="number" >
            </mat-form-field>
        </div>
        <button class="order-first sm:order-last w-full" mat-flat-button [color]="'primary'" (click)="send()">
            Guardar
        </button>
    </form>
</div>
