<div class="max-w-2xl w-full bg-white dark:bg-gray-900 rounded-xl shadow-lg p-6 space-y-4 max-h-[90vh] overflow-y-auto">
  <div class="flex items-center justify-between border-b border-gray-200 dark:border-gray-700 pb-2">
    <h2 class="text-xl font-bold">Usuarios de {{ data.tenantName }}</h2>
    <button type="button" class="btn-icon" (click)="dialogRef.close()" aria-label="Cerrar" title="Cerrar"><mat-icon>close</mat-icon></button>
  </div>

  <div class="flex items-center gap-2">
    <input type="text" [(ngModel)]="nuevoUsuario" name="nuevoUsuario" placeholder="Llave del usuario (cusr_llave)" class="flex-1 border border-gray-300 dark:border-gray-600 rounded px-3 py-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500" />
    <button type="button" class="btn-flat-primary" (click)="asignar()" [disabled]="cargando() || !nuevoUsuario.trim()"><mat-icon>add</mat-icon> Asignar</button>
  </div>

  @if (cargando()) { <div class="w-full h-1 bg-gray-200 dark:bg-gray-700 rounded overflow-hidden"><div class="h-full bg-primary rounded animate-pulse" style="width: 40%;"></div></div> } @else {
    <div class="divide-y divide-gray-200 dark:divide-gray-700">
      @for (item of usuarios(); track item.key) {
        <div class="py-3 flex items-center justify-between gap-2">
          <div class="min-w-0">
            <p class="font-mono text-sm text-gray-900 dark:text-gray-100 truncate">{{ item.usuario }}</p>
            <p class="text-xs text-gray-500 dark:text-gray-400">{{ item.state === 'A' ? 'Asignado' : 'Retirado' }}</p>
          </div>
          <button type="button" class="btn-icon" (click)="retirar(item)" title="Retirar" aria-label="Retirar"><mat-icon>person_remove</mat-icon></button>
        </div>
      } @empty {
        <div class="text-center py-8 text-gray-500 dark:text-gray-400">Sin usuarios asignados</div>
      }
    </div>
  }

  <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
    <button type="button" class="btn-flat" (click)="dialogRef.close()">Cerrar</button>
  </div>
</div>
