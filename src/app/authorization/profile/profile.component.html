<div class="flex flex-col flex-auto min-w-0">

    <div *ngIf="loginservice.isloginView" class="px-4 fixed m-auto z-999 w-full">
        <div class="flex justify-center items-center h-screen">

            <mat-card>
                <mat-card-content>
                    <div *ngIf="hasLanding" class="w-full flex justify-end">
                        <button mat-icon-button (click)="toogleShowLogin()">
                            <mat-icon svgIcon="heroicons_outline:x-circle"></mat-icon>
                        </button>
                    </div>
                    <div class="text-center p-4">
                        <img class="m-auto" src="{{ company?.imagen | imageFormat }}" alt="">
                        <p class="m-0">{{company?.nombre}}</p>
                    </div>
                    <form [formGroup]="signInForm" (ngSubmit)="signIn()">
                        <div>
                            <mat-form-field>
                                <input matInput name="username" [formControl]="signInForm.controls['username']"
                                    placeholder="Usuario" value="">
                            </mat-form-field>
                            <small
                                *ngIf="signInForm.controls['username'].hasError('required') && signInForm.controls['username'].touched"
                                class="form-error-msg"> Necesitamos tu usuario para poder autenticarnos </small>
                        </div>
                        <div>
                            <mat-form-field>
                                <input type="password" name="password" matInput
                                    [formControl]="signInForm.controls['password']" placeholder="Clave de aceso"
                                    autocomplete="new-password" value="">
                            </mat-form-field>
                            <small
                                *ngIf="signInForm.controls['password'].hasError('required') && signInForm.controls['password'].touched"
                                class="form-error-msg"> No olvides colocar tu clave y que nadie la sepa :)</small>
                        </div>

                        <button mat-raised-button class="mat-primary w-full mb-1" [disabled]="signInForm.invalid">Ingresar</button>
                        <small class="m-0">{{currentApplicationVersion}}</small>
                        <div class="text-center">
                            <a [routerLink]="'/sessions/recover'" class="mat-primary text-center w-full">Recordar clave
                                acceso</a>
                        </div>
                    </form>
                </mat-card-content>
            </mat-card>
        </div>
    </div>
    <div *ngIf="headerSection" class="w-full" >
        <div *ngFor="let iHeader of headerSection" [innerHTML]="iHeader" class="w-full"></div>
    </div>
    
    <div *ngIf="user" class="flex flex-auto flex-col">
        <!-- Header -->
        <div class="flex flex-col shadow bg-card">

            <!-- Cover image -->
            <div *ngIf="slides">
                <mat-carousel timings="250ms ease-in" [autoplay]="true" interval="5000" color="accent" maxWidth="auto"
                    proportion="25" slides="5" [loop]="true" [hideArrows]="false" [hideIndicators]="true"
                    [useKeyboard]="true" [useMouseWheel]="false" orientation="ltr"
                    class="h-40 lg:h-50 object-cover w-full">
                    <mat-carousel-slide #matCarouselSlide *ngFor="let slide of slides; let i = index"
                        [image]="slide.image" overlayColor="#00000040" [hideOverlay]="true"></mat-carousel-slide>
                </mat-carousel>
            </div>

            <!-- User info -->
            <div class="flex flex-row flex-0 items-center max-w-5xl w-full mx-auto px-8 lg:h-18 bg-card">

                <!-- Avatar -->
                <div class=" max-w-32 z-0">
                    <img class="w-full h-full rounded-full ring-4 ring-bg-card bg-white" [src]="company?.imagen"
                        alt="User avatar">
                </div>

                <!-- Details -->
                <div class="flex flex-col items-center lg:items-start mt-4 mb-4 lg:mt-0 lg:mb-0">
                    <div class="text-lg font-bold leading-none">{{ company?.nombre }}</div>
                    <div class="text-secondary p-1">{{ company?.slogan }}</div>
                </div>

            </div>

        </div>

        <!-- Main -->
        <!--div class="flex flex-auto justify-center w-full max-w-5xl mx-auto p-3"-->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-y-6 lg:gap-y-0 md:gap-x-6 px-8 py-4">

            <!-- Column -->
            <div class=" col-span-1 lg:col-span-2 flex flex-col items-start w-full">

                <!-- Filtro modulos -->
                <mat-card class="flex flex-col w-full p-3">
                    <div class="text-xl font-semibold">Bienvenido {{ user?.name }}</div>
                    <div class="flex flex-col sm:flex-row items-start mt-2">
                        <div class="hidden sm:flex items-center">
                            <img class="w-12 min-w-12 h-12 rounded-full mr-4" src="{{ user?.imagen }}">
                        </div>
                        <mat-form-field class="w-full">
                            <input #searchModule matInput [placeholder]="'Que deseas consultar?'"
                                [formControl]="filterControl" (input)="filterItem()" (keyUp.enter)="selectFirst()" />
                        </mat-form-field>
                    </div>
                </mat-card>

                <!-- modulos -->
                <div class="w-full">
                    <div class="flex flex-wrap mt-4">
                        <div class="w-full sm:w-1/2 lg:w-1/3 xl:w-1/4 p-1" *ngFor="let template of filteredModules">
                            <app-template class="h-full" [id]="template.llaveTabla" [nombre]="template.nombre"
                                [imagen]="template.imagen" [process_id]="template.proceso" [serverId]="template.server"
                                [type]="template.estado"></app-template>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Reportes -->
            <mat-card class=" col-span-1 flex flex-col w-full p-3">
                <div class="flex items-center justify-between">
                    <div class="text-2xl font-semibold leading-tight">Reportes</div>
                </div>
                <div class="w-full  p-1" *ngFor="let template of filteredReports">
                    <app-template class="h-full" [id]="template.llaveTabla" [nombre]="template.nombre"
                        [imagen]="template.imagen" [process_id]="template.proceso" [serverId]="template.server"
                        [type]="template.estado"></app-template>
                </div>
            </mat-card>

        </div>

    </div>
    <div *ngIf="!hasLanding && !user" class="min-h-full flex items-center w-full bg-slate-900"></div>
    <div *ngIf="landing" class="w-full" >
        <div *ngFor="let iFooter of landing" [innerHTML]="iFooter" class="w-full"></div>
    </div>

</div>
