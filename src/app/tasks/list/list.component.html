<div class="absolute inset-0 flex flex-col min-w-0 overflow-hidden">

    <mat-drawer-container class="flex-auto h-full bg-card dark:bg-transparent" (backdropClick)="onBackdropClicked()">


        <!-- Drawer -->
        <mat-drawer class="w-full sm:w-[70%] dark:bg-gray-900" [mode]="drawerMode" [opened]="false" [position]="'start'"
            [disableClose]="true" #matDrawer>
            <router-outlet></router-outlet>
        </mat-drawer>

        <mat-drawer-content class="flex flex-col">

            <!-- Principal -->
            <div class="flex flex-col flex-auto justify-between;">
                <div class="flex items-center justify-between;">
                    <div class="px-4 flex">
                        <div class="text-4xl font-extrabold tracking-tight leading-none p-8"> 📝 Notas </div>
                        <div
                            class="flex flex-col sm:flex-row items-start sm:items-center sm:justify-between py-5 px-5 md:px-5">
                            <!-- Add task button -->
                            <button mat-flat-button [color]="'primary'" (click)="createTask()"
                                [matTooltip]="'Shortcut: Ctrl + /'">
                                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                            </button>
                        </div>
                    </div>

                </div>




                <!-- Tasks list -->
                <ng-container *ngIf="tasks && tasks.length > 0; else noTasks">
                    <div class="divide-y" cdkDropList [cdkDropListData]="tasks" (cdkDropListDropped)="dropped($event)">

                        <!-- Task -->
                        <ng-container *ngFor="let task of tasks; let first = first; trackBy: trackByFn">
                            <div [id]="task.llaveTabla"
                                class="group w-full select-none hover:bg-gray-100 dark:hover:bg-hover h-16"
                                [ngClass]="{'text-hint': task.completed}" [class.border-t]="first" cdkDrag
                                [cdkDragLockAxis]="'y'">

                                <!-- Drag preview -->
                                <div class="flex flex-0 w-0 h-0" *cdkDragPreview></div>

                                <!-- Task content -->
                                <div class="relative flex items-center h-full pl-5">

                                    <!-- Selected  -->
                                    <ng-container *ngIf="selectedTask && selectedTask.id === task.id">
                                        <div
                                            class="z-10 absolute -top-px right-0 -bottom-px flex flex-0 w-1 bg-primary">
                                        </div>
                                    </ng-container>

                                    <!-- Drag handle -->
                                    <div class="md:hidden absolute flex items-center justify-center inset-y-0 left-0 w-8 cursor-move md:group-hover:flex"
                                        cdkDragHandle>
                                        <mat-icon class="icon-size-5 text-hint"
                                            [svgIcon]="'heroicons_outline:check-circle'"></mat-icon>
                                    </div>


                                    <!-- Task link -->
                                    <a class="flex flex-auto items-center min-w-0 h-full pr-7"
                                        (click)="selectTask(task)">
                                        <!-- Title & Placeholder -->
                                        <div class="flex-auto mr-2 truncate px-5">
                                            <span [class.text-red-500]="!task.title || task.title.trim() === ''">
                                                {{ task.title && task.title.trim() !== '' ? task.title : 'Escribe el título…' }}
                                            </span>
                                        </div>
                                        <!-- Priority -->
                                        <div class="w-4 h-4 mr-3">
                                            <!-- Low -->
                                            <mat-icon class="icon-size-4 text-green-600 dark:text-green-400"
                                                *ngIf="task.priority === 0"
                                                [svgIcon]="'heroicons_outline:arrow-narrow-down'"
                                                [title]="'Low'"></mat-icon>
                                            <!-- High -->
                                            <mat-icon class="icon-size-4 text-red-600 dark:text-red-400"
                                                *ngIf="task.priority === 2"
                                                [svgIcon]="'heroicons_outline:arrow-narrow-up'"
                                                [title]="'High'"></mat-icon>
                                        </div>
                                        <!-- Due date -->
                                        <div class="text-sm whitespace-nowrap text-secondary">
                                            {{task.dueDate | date:'LLL dd'}}
                                        </div>

                                        <button mat-icon-button [matMenuTriggerFor]="moreMenu">
                                            <mat-icon [svgIcon]="'heroicons_outline:ellipsis-vertical'"></mat-icon>
                                        </button>
                                        <mat-menu #moreMenu="matMenu">
                                            <button mat-menu-item (click)="deleteTask(task)">
                                                <mat-icon [svgIcon]="'heroicons_outline:trash'"></mat-icon>
                                                <span>Delete </span>
                                            </button>
                                        </mat-menu>
                                    </a>
                                </div>
                            </div>
                        </ng-container>
                    </div>

                </ng-container>

                <ng-template #noTasks>
                    <div class="flex flex-auto flex-col items-center justify-center bg-gray-100 dark:bg-transparent">
                        <mat-icon class="icon-size-24" [svgIcon]="'heroicons_outline:clipboard-document'"></mat-icon>
                        <div class="mt-4 text-2xl font-semibold tracking-tight text-secondary">Agrega una tarea para iniciar a planear!</div>
                    </div>
                </ng-template>

            </div>

        </mat-drawer-content>

    </mat-drawer-container>

</div>
