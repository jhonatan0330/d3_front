<div [style.display]="isInvisible ? 'none': 'block'">
    <div class="border-b font-bold text-center mb-1 pb-1 cursor-pointer flex items-center justify-between p-2 bg-gray-100 hover:bg-gray-200 transition-all rounded-t-lg"
        (click)="mostrarOcultar()">

        <span>{{ structure.nombre }}</span>
        <svg [class.rotate-180]="!isSectionInvisible" class="w-4 h-4 transform transition-transform duration-300"
            fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 10 6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5 5 1 1 5" />
        </svg>
    </div>
</div>
