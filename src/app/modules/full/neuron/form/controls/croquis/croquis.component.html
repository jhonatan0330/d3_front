<!-- Campo que abre el popup -->
<mat-form-field
  class="full-width"
  appearance="outline"
  [style.display]="(isInvisible || isSectionInvisible) ? 'none' : 'block'"
  (click)="openCroquisDialog(croquisDialog)">
  <mat-label>{{ structure.nombre | titlecase }}</mat-label>
  <input matInput readonly [value]="valorTextCtrl.value || ''" />
</mat-form-field>

<ng-template #croquisDialog>
  <h2 mat-dialog-title>{{ structure.nombre | titlecase }}</h2>

  <mat-dialog-content class="w-full space-y-3">

    <div class="flex items-center gap-2 flex-wrap">
      <button
        mat-stroked-button
        color="primary"
        (click)="setBase()"
        [disabled]="!isEnabled">
        Subir plano
      </button>

      <mat-form-field appearance="outline" style="min-width: 240px;">
        <mat-label>Nombre del componente</mat-label>
        <input matInput [formControl]="nombreCtrl" maxlength="120" />
        <mat-hint align="end">
          {{ (nombreCtrl.value || '').length }} / 120
        </mat-hint>
      </mat-form-field>

      <button
        mat-stroked-button
        color="accent"
        (click)="addComponente()"
        [disabled]="!isEnabled">
        Agregar componente
      </button>

      <span class="flex-1"></span>
    </div>

    <div class="w-full border rounded-md overflow-hidden" style="max-width: 100%;">
      <canvas
        id="croquisCanvas"
        width="500"
        height="300"
        style="display:block; width:100%; height:auto; cursor: grab;"
        [style.opacity]="isEnabled ? 1 : 0.7"
        aria-label="Croquis interactivo">
      </canvas>
    </div>

    <input
      id="fileBaseInput"
      type="file"
      accept="image/*"
      class="hidden"
      (change)="onFileBaseChange($event)" />

    <input
      id="fileItemInput"
      type="file"
      accept="image/*"
      class="hidden"
      (change)="onFileItemChange($event)" />

  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cerrar</button>
  </mat-dialog-actions>
</ng-template>
