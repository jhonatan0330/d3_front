<!-- Campo que abre el popup -->
<mat-form-field
  class="full-width"
  appearance="outline"
  [style.display]="(isInvisible || isSectionInvisible) ? 'none' : 'block'"
  (click)="openCroquisDialog(croquisDialog)">
  <mat-label>{{ structure.nombre | titlecase }}</mat-label>
  <input matInput readonly [value]="valorTextCtrl.value || ''" />
</mat-form-field>

<ng-template #croquisDialog>
  <mat-dialog-content class="w-full space-y-4 p-6 relative">
    <button mat-dialog-close aria-label="Cerrar" class="absolute right-3 top-3 btn-icon">
      <mat-icon>close</mat-icon>
    </button>

    <div class="max-w-3xl mx-auto space-y-4 text-center">
      <div class="flex items-center gap-3 justify-center flex-wrap">
        <button
          (click)="setBase()"
          [disabled]="!isEnabled"
          class="px-3 py-1 text-sm h-8 btn-flat-primary">
          Subir Plano
        </button>

        <mat-form-field appearance="outline" class="mx-2" style="min-width:180px; max-width:320px; width:40%;">
          <mat-label>Nombre Elemento</mat-label>
          <input matInput [formControl]="nombreCtrl" maxlength="120" />
          <mat-hint align="end" class="text-xs">
            {{ (nombreCtrl.value || '').length }} / 120
          </mat-hint>
        </mat-form-field>

        <button
          (click)="addComponente()"
          [disabled]="!isEnabled"
          class="px-3 py-1 text-sm h-8 btn-flat-accent">
          Agregar
        </button>
      </div>

      <div class="w-full border rounded-md overflow-hidden mx-auto" style="max-width:720px;">
        <canvas
          id="croquisCanvas"
          width="800"
          height="480"
          style="display:block; width:100%; height:auto; cursor: grab; max-height:60vh;"
          [style.opacity]="isEnabled ? 1 : 0.7"
          aria-label="Croquis interactivo">
        </canvas>
      </div>

      <input
        id="fileBaseInput"
        type="file"
        accept="image/*"
        class="hidden"
        (change)="onFileBaseChange($event)" />

      <input
        id="fileItemInput"
        type="file"
        accept="image/*"
        class="hidden"
        (change)="onFileItemChange($event)" />
    </div>
  </mat-dialog-content>
</ng-template>
