<div class="flex flex-col flex-auto items-center sm:justify-center min-w-0 bg-slate-900 text-white">
    <div class="w-full sm:w-auto py-8 px-4 sm:p-12 sm:rounded-2xl sm:shadow sm:bg-slate-800">
        <div class="w-full max-w-80 sm:w-80 mx-auto sm:mx-0">

            <!-- Logo -->
            <div class="p-4">
                <img class="m-auto" src="assets/images/password_secure.png" alt="Logo seguridad">
            </div>

            <!-- Título -->
            <div class="mt-8 text-4xl font-extrabold tracking-tight leading-tight text-center">
                Introduce el código
            </div>

            <!-- Mensaje de error -->
            <p *ngIf="errorMsg" class="text-center mt-2">
                <small class="text-red-400">{{ errorMsg }}</small>
            </p>

            <!-- Formulario -->
            <form class="mt-8" [formGroup]="recoverForm" (ngSubmit)="signin()">

                <!-- Texto de instrucción (solo cuando está vacío) -->
                <p *ngIf="showInstruction" class="text-center text-gray-400 mb-1">
                    Introduce el código que te llegó al correo de tu cuenta
                </p>

                <input type="number" id="code" formControlName="code"
                    class="w-full text-center text-4xl p-3 rounded-lg text-black mb-3" placeholder="Código" />

                <button type="submit" mat-raised-button color="primary" class="w-full mb-1 font-semibold"
                    [disabled]="recoverForm.invalid">
                    Aceptar
                </button>

                <!-- Footer -->
                <div class="mt-8 text-md font-medium text-center text-gray-400">
                    <span>Regresar </span>
                    <a class="ml-1 text-blue-400 hover:underline" routerLink="/sign-in">
                        a la pantalla principal
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
