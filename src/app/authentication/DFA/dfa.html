<div class="relative flex w-full min-h-screen items-center justify-center overflow-hidden bg-slate-50 dark:bg-slate-900">
  <canvas class="absolute inset-0 h-full w-full" appParticleBackground></canvas>

  <div class="relative z-10 w-full px-4 py-8 sm:bg-card sm:w-auto sm:rounded-2xl sm:p-12 sm:shadow md:p-16">
    <div class="mx-auto w-full max-w-80 sm:mx-0 sm:w-80">
      <!-- Logo -->
      <div class="text-center p-4">
        <img class="m-auto" src="assets/images/password_secure.png" alt="Logo seguridad">
      </div>

      <!-- Title -->
      <div class="mt-8 text-4xl font-extrabold leading-tight tracking-tight">
        Introduce el código
      </div>

      @if (errorMsg) {
        <p class="text-center mt-2">
          <small class="text-red-400">{{ errorMsg }}</small>
        </p>
      }

      <form class="mt-8" [formGroup]="recoverForm" (ngSubmit)="signin()">
        <!-- Instruction text (only when empty) -->
        @if (showInstruction) {
          <p class="text-center text-gray-400 mb-1">
            Introduce el código que te llegó al correo de tu cuenta
          </p>
        }

        <!-- Code field -->
        <div class="mb-5">
          <input type="text" id="code" formControlName="code"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 text-center text-4xl dark:border-gray-600 dark:placeholder-gray-400 dark:focus:ring-blue-500 dark:focus:border-blue-500"
            placeholder="Código">
        </div>

        <!-- Submit button -->
        <div class="mb-5">
          <button type="submit"
            class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
            [disabled]="recoverForm.invalid">
            Aceptar
          </button>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-md font-medium text-center text-secondary">
          <span>Regresar </span>
          <a class="ml-1 text-primary-500 hover:underline" routerLink="/sign-in">a la pantalla principal</a>
        </div>
      </form>
    </div>
  </div>
</div>
