<!-- Transferir documento -->
<div class="card p-4">
  <div>
    <form [formGroup]="transferForm" (ngSubmit)="transfer()">
      <mat-form-field>
        <input matInput name="responsable" [matAutocomplete]="auto" [formControl]="transferForm.controls['responsable']"
          placeholder="Asignar a" required />
          <mat-autocomplete #auto="matAutocomplete" [displayWith]="autoCompleteDisplayTransfer">
            @for (user of users; track user) {
              <mat-option [value]="user">
                <div class="flex">
                  <img class="icon-size-10 rounded my-1" src="{{ user?.imagen | imageFormat }}" />
                  <small class="px-2">{{ user.nombre }}</small>
                </div>
              </mat-option>
            }
          </mat-autocomplete>
        </mat-form-field>
        <mat-form-field>
          <textarea name="comentario" class="textarea-form" matInput [formControl]="transferForm.controls['comentario']"
          placeholder="Comentario" required></textarea>
        </mat-form-field>
        <div class="flex justify-between">
          <button class="btn-flat-accent" (click)="dialogRef.close(false)">
            <mat-icon>exit_to_app</mat-icon> Cerrar
          </button>
          <span></span>
          @if (!isTransfering) {
            <button class="mat-primary mb-1 btn-raised" [disabled]="transferForm.invalid">
              Reasignar
            </button>
          }
          @if (isTransfering) {
            <div class="w-full h-1 bg-gray-200 dark:bg-gray-700 rounded overflow-hidden">
              <div class="h-full bg-primary rounded animate-pulse" style="width: 40%;"></div>
            </div>
          }
        </div>

      </form>
    </div>
    <!-- Boton cerrar -->
    <div>

    </div>
  </div>
