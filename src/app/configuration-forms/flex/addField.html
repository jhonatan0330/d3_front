<div class="max-w-md mx-auto bg-white text-black rounded-xl shadow-lg p-6 space-y-4">
  <h2 class="text-center text-lg font-bold border-b border-gray-300 pb-2">
    DOCUMENTO PLANTILLA CARACTERISTICA
  </h2>

  <div>
    <label class="block text-sm font-semibold mb-1">Formato</label>
    <select class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
      [(ngModel)]="campo.formato">
      @for (opcion of opciones; track opcion) {
        <option [value]="opcion.valor">
          {{ opcion.nombre }}
        </option>
      }
    </select>
  </div>

  <div>
    <label class="block text-sm font-semibold mb-1">Nombre</label>
    <input type="text" [(ngModel)]="campo.nombre"
      class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <div>
      <label class="block text-sm font-semibold mb-1">Código</label>
      <input type="text" [(ngModel)]="campo.codigo"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">Orden</label>
        <input type="number" min="1" [(ngModel)]="campo.orden"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        @if (imagenPreview) {
          <div class="mt-2 text-center">
            <img [src]="imagenPreview" alt="Vista previa" class="max-h-32 mx-auto rounded border border-gray-300" />
          </div>
        }

        <div>
          <label class="block text-sm font-semibold mb-1">Objetivo</label>
          <textarea rows="3" [(ngModel)]="campo.objetivo"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <div class="pt-2">
          <button type="button" (click)="actualizarCampo()" [disabled]="cargando"
            class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-semibold py-2 rounded">
            {{ cargando ? 'Actualizando...' : 'Actualizar' }}
          </button>
        </div>
      </div>
