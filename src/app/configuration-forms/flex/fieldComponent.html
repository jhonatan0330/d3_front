<div class="w-full h-full bg-gray-100 dark:bg-gray-900 p-4 sm:p-6 flex flex-col text-gray-900 dark:text-gray-100">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6 gap-4">
    <div class="flex items-center flex-wrap justify-center sm:justify-start">
      <div class="text-xl font-bold">{{ field?.nombre || 'Detalle de plantila' }}</div>
      <button [disabled]="editarDisabled" (click)="!editarDisabled && editarCampo()"
        [ngClass]="{'opacity-50 hover:bg-blue-600': editarDisabled, 'bg-blue-500 text-white hover:bg-blue-600': !editarDisabled}"
        class="px-3 py-1 rounded">
        ✏
      </button>
    </div>
    <div class="flex items-center gap-2">
      <img *ngIf="field?.imagen" [src]="field.imagen" alt="Imagen del campo" class="h-10 object-cover rounded-lg" />
      <button mat-icon-button aria-label="Cerrar" (click)="close()" class="ml-2 bg-transparent">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <div class="flex-1 h-full">
    <!-- ===== Propiedades de Campo ===== -->
    <div class="flex flex-col h-full">
      <div class="flex justify-between items-center mb-2 flex-wrap gap-2">
        <h2 class="text-lg font-bold">Propiedades de {{tipo}}</h2>
        <div class="flex gap-2">
          <button (click)="agregarPropiedadCampo()" class="bg-blue-500 text-white rounded px-3 py-1 hover:bg-blue-600"
            title="Agregar propiedad">
            ➕
          </button>
          <button (click)="listarPropiedadesCampo()" class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600"
            title="Recargar">
            ↺
          </button>
        </div>
      </div>

      <div class="bg-white dark:bg-gray-800 rounded-xl shadow flex-1 p-3 sm:p-4 overflow-y-auto">
        <ng-container *ngIf="propiedadesCampo?.length > 0; else noPropsField">
          <div class="grid grid-cols-1 gap-3">
            <div *ngFor="let prop of propiedadesCampo" (click)="listarRelacionesPropiedad(prop)"
              class="group border border-gray-200 dark:border-gray-700 rounded-lg p-3 bg-gray-50 dark:bg-gray-700 hover:shadow-md transition relative cursor-pointer">
              <!--<span class="text-xs text-gray-500 dark:text-gray-400 font-mono block">{{
                prop.propiedadValor
                }}</span>-->
              <h4 class="text-base font-semibold">{{ prop.nombre }}</h4> 
              <p class="text-sm text-gray-600 dark:text-gray-300">{{ prop.texto }}</p>

              <!-- Botones visibles solo al pasar el mouse -->
              <div
                class="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
                <button (click)="editarPropiedad(prop); $event.stopPropagation()"
                  class="bg-blue-500 text-white text-xs px-2 py-1 rounded hover:bg-blue-600" title="Editar">
                  ✏
                </button>
                <button (click)="eliminarPropiedad(prop); $event.stopPropagation()"
                  class="bg-red-500 text-white text-xs px-2 py-1 rounded hover:bg-red-600" title="Eliminar">
                  ❌
                </button>
              </div>
            </div>
          </div>
        </ng-container>

        <ng-template #noPropsField>
          <div class="text-center text-sm text-gray-500 dark:text-gray-400 py-4">
            Sin relaciones de propiedad
          </div>
        </ng-template>
      </div>
    </div>
  </div>
