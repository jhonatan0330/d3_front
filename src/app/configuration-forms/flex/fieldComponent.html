<div class="min-h-screen w-full bg-gray-100 dark:bg-gray-900 p-4 sm:p-6 flex flex-col text-gray-900 dark:text-gray-100">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
    <div class="flex items-center gap-4 flex-wrap justify-center sm:justify-start">
      <div class="text-xl font-bold">{{ campo?.nombre || 'Detalle de Campo' }}</div>
      <button
        (click)="editarCampo()"
        class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600"
      >
        ✏
      </button>
    </div>
    <img
      *ngIf="campo?.imagen"
      [src]="campo.imagen"
      alt="Imagen del campo"
      class="h-10 object-cover rounded-lg"
    />
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 flex-1 h-full">
    <!-- ===== Propiedades de Campo ===== -->
    <div class="flex flex-col h-full">
      <div class="flex justify-between items-center mb-2 flex-wrap gap-2">
        <h2 class="text-lg font-bold">Propiedades de Campo</h2>
        <div class="flex gap-2">
          <button
            (click)="agregarPropiedadCampo()"
            class="bg-blue-500 text-white rounded px-3 py-1 hover:bg-blue-600"
            title="Agregar propiedad"
          >
            ➕
          </button>
          <button 
            (click)="listarPropiedadesCampo()"
            class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600"
            title="Recargar"
          >
            ↺
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
