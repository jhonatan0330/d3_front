<div class="mx-auto mt-6 w-full px-4 lg:px-8">
  <div class="rounded-[28px] border border-slate-200/80 bg-linear-to-br from-slate-50 via-white to-slate-100 p-3 shadow-[0_18px_45px_rgba(15,23,42,0.08)] ring-1 ring-white/70 dark:border-slate-800 dark:from-slate-900 dark:via-slate-950 dark:to-slate-900 dark:ring-slate-800/80">
    <div class="mb-3 flex items-center justify-between px-2">
      <div>
        <p class="text-[10px] font-semibold uppercase tracking-[0.24em] text-slate-500 dark:text-slate-400">Indicadores</p>
      </div>
      <span class="rounded-full border border-slate-200 bg-white px-2.5 py-1 text-[10px] font-medium text-slate-600 shadow-sm dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300">{{ indicadores().length }} KPI</span>
    </div>

    <div class="grid grid-cols-1 gap-3 md:grid-cols-2 xl:grid-cols-4">
      @for (indicador of indicadores(); track indicador.llaveTabla) {
        <indicator-card [indicador]="indicador" />
      } @empty {
        <div class="col-span-full rounded-2xl border border-neutral-100 bg-white p-10 text-center text-neutral-400 dark:border-neutral-800 dark:bg-neutral-900 dark:text-neutral-500">
          No hay indicadores disponibles
        </div>
      }
    </div>
  </div>
</div>
