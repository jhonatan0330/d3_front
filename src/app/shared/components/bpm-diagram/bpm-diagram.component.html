<section class="bpm-dialog" [style.width.px]="data?.width || 1120" [style.height.px]="data?.height || 760">
  <header class="dialog-header">
    <div>
      <h2>Mapa del proceso</h2>
      <p>Explora la estructura y sus procesos asociados</p>
    </div>
    <button type="button" class="close-button" aria-label="Cerrar diagrama" (click)="close()">×</button>
  </header>

  <div class="dialog-body">
    @if (isLoading()) {
      <div class="loading-state" role="status">Cargando estructura del proceso...</div>
    } @else if (hasError()) {
      <div class="error-state" role="alert">
        <span>No se pudo cargar la estructura del proceso.</span>
        <button type="button" (click)="loadProcessGraph()">Reintentar</button>
      </div>
    } @else if (!canvasNodes().length) {
      <div class="loading-state" role="status">Este proceso no tiene elementos para mostrar.</div>
    } @else {
      <bpm-canvas mode="tree" [nodes]="canvasNodes()" (nodeActivated)="onNodeActivated($event)"></bpm-canvas>
    }
  </div>
</section>
