<section class="bpm-leaf-dialog">
  <header class="dialog-header">
    <div>
      <h2>Estados del proceso</h2>
      <p>Transiciones disponibles y estado actual del flujo</p>
    </div>
    <button type="button" class="close-button" aria-label="Cerrar diagrama" (click)="close()">×</button>
  </header>

  @if (isLoading()) {
    <div class="loading-state" role="status">
      <div class="loading-bar"><span></span></div>
      <span>Cargando estados del proceso...</span>
    </div>
  } @else if (hasError()) {
    <div class="message-state" role="alert">
      <span>No se pudieron cargar los estados del proceso.</span>
      <button type="button" (click)="loadTemplate()">Reintentar</button>
    </div>
  } @else if (!nodes().length) {
    <div class="message-state" role="status">Este proceso no tiene estados configurados.</div>
  } @else {
    <bpm-canvas
      mode="flow"
      [nodes]="nodes()"
      [edges]="edges()"
      (nodeActivated)="onStateActivated($event)"
      (actionActivated)="onActionActivated($event)"
    ></bpm-canvas>
  }
</section>
