<div class="w-full">
  <div class="flex items-center justify-between pb-2">
    <div class="min-w-0">
      <div class="text-sm font-semibold">Plantillas relacionadas</div>
      <div class="text-xs text-secondary">Selecciona una plantilla para ver sus documentos relacionados</div>
    </div>
    <button type="button" class="btn-icon-sm shrink-0" title="Cerrar" (click)="dialogRef.close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  @if (related().length === 0) {
    <div class="p-2 text-sm text-secondary">
      Esta plantilla no tiene relaciones configuradas.
    </div>
  }

  <div class="grid gap-1">
    @for (entry of related(); track entry.key) {
      <button type="button"
        class="flex w-full items-center gap-2 rounded border border-gray-200 p-2 text-left hover:bg-gray-50 dark:border-gray-700 dark:hover:bg-gray-800"
        (click)="selectTemplate(entry)">
        <img class="h-8 w-8 rounded object-contain" src="{{ entry.templateImage | imageFormat }}" alt="" />
        <span class="min-w-0 flex-1">
          <span class="block truncate text-sm font-semibold">{{ entry.templateName }}</span>
          <span class="block truncate text-xs text-secondary">{{ entry.property.texto }}</span>
        </span>
        <mat-icon class="text-secondary">open_in_new</mat-icon>
      </button>
    }
  </div>
</div>
