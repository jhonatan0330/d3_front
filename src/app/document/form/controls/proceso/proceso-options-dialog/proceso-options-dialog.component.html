<section class="rounded-2xl bg-white p-4 text-gray-900 dark:bg-gray-900 dark:text-gray-100 sm:p-5" aria-labelledby="proceso-options-title">
  <header class="mb-4 flex items-start justify-between gap-3">
    <div>
      <h2 id="proceso-options-title" class="text-lg font-bold">
        Seleccionar {{ data.title | titlecase }}
      </h2>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
        Elige una de las opciones disponibles
      </p>
    </div>
    <button type="button" class="btn-icon" (click)="dialogRef.close()" aria-label="Cerrar opciones" title="Cerrar">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <mat-form-field class="w-full" appearance="outline">
    <mat-label>Buscar opción</mat-label>
    <input matInput #filterInput
      type="search"
      autocomplete="off"
      [value]="filterText()"
      (input)="updateFilter($any($event.target).value)"
      placeholder="Escribe para filtrar las opciones" />
  </mat-form-field>

  <div class="grid max-h-[70vh] grid-cols-2 gap-2 overflow-y-auto sm:grid-cols-3 sm:gap-3 lg:grid-cols-4">
    @for (document of filteredOptions; track document.llaveTabla) {
      <button type="button"
        class="flex min-h-28 flex-col items-center justify-center overflow-hidden rounded-xl border border-gray-200 bg-white p-3 text-center shadow-sm transition hover:-translate-y-0.5 hover:border-primary hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary dark:border-gray-700 dark:bg-gray-800"
        (click)="select(document)">
        @if (document.imagen) {
          <img class="mb-2 h-14 w-14 object-contain" [src]="document.imagen | imageFormat" alt="" />
        } @else {
          <mat-icon class="mb-2 text-primary" aria-hidden="true">description</mat-icon>
        }
        <span class="line-clamp-2 text-sm font-semibold text-gray-800 dark:text-gray-100">
          {{ document.descripcion || document.nombre }}
        </span>
        @if (document.descripcion && document.nombre !== document.descripcion) {
          <span class="mt-1 line-clamp-1 text-xs text-secondary">
            {{ document.nombre }}
          </span>
        }
        @if (document.dinero?.valorTotal != null && document.dinero?.saldo != null) {
          <span class="mt-2 block text-xs text-secondary">
            {{ document.dinero.valorTotal | number }} · Saldo {{ document.dinero.saldo | number }}
          </span>
        }
      </button>
    }
    @if (filteredOptions.length === 0) {
      <p class="col-span-full rounded-xl border border-dashed border-gray-300 px-4 py-6 text-center text-sm text-gray-500 dark:border-gray-700 dark:text-gray-400">
        No hay opciones que coincidan con la búsqueda.
      </p>
    }
  </div>
</section>
