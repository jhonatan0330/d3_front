<div class="absolute inset-0 flex flex-col min-w-0 overflow-hidden">

    <mat-drawer-container class="flex-auto h-full">

        <!-- Drawer -->
        <mat-drawer
            class="w-72 dark:bg-gray-900"
            [mode]="drawerMode"
            [opened]="drawerOpened"
            #drawer>

            <!-- sidebar -->
            <cruds-sidebar></cruds-sidebar>

        </mat-drawer>

        <!-- Drawer content -->
        <mat-drawer-content class="flex flex-col" fuseScrollReset>

            <!-- Main -->
            <div class="flex-auto">
                <cruds-list [sidebar]="drawer" ></cruds-list>
            </div>

        </mat-drawer-content>


    </mat-drawer-container>

</div>
