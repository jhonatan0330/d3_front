<div class="full-width">
  <button 
      mat-raised-button
      color="accent"
      (click)="isActive = true"
      *ngIf="!isActive"
      matBadgeColor="primary"
      class="full-width"
    >
      {{ structure.nombre | titlecase }} 
    </button>

    <app-ol-map
    lat="4.59845"
    lon="-74.18218"
    zoom="16"
    width="100%"
    height="500px"
    *ngIf="isActive">
    </app-ol-map>
</div>
