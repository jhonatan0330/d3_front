<mat-card>
  <mat-card-content>
    <div class="text-center">
      <video
        class="p-4"
        #video
        id="video"
        [width]="WIDTH"
        [height]="WIDTH"
        autoplay
      ></video>
      <div>
        <button
          mat-raised-button
          color="accent"
          class="full-width"
          (click)="fileInput.click()"
        >
          <mat-icon>attach_file</mat-icon> Buscar foto
        </button>
        <input hidden (change)="onFileSelected($event.target.files)" #fileInput type="file" id="file">
        <button
          mat-raised-button
          color="primary"
          class="full-width"
          (click)="capture()"
        >
          <mat-icon>add_a_photo</mat-icon> Tomar foto
        </button>
      </div>

      <canvas
        class="p-4"
        #canvas
        id="canvas"
        [width]="WIDTH"
        [height]="WIDTH"
      ></canvas>
    </div>
  </mat-card-content>
  <mat-dialog-actions>
    <!-- Boton de guardar -->
    <mat-progress-bar
      class="full-width"
      mode="indeterminate"
      *ngIf="submitted"
    ></mat-progress-bar>
    <div fxFlex class="p-4" *ngIf="!submitted && dataUrl">
      <button
        mat-raised-button
        color="primary"
        class="full-width"
        (click)="submit()"
      >
        <mat-icon>save</mat-icon> Actualizar foto
      </button>
    </div>
  </mat-dialog-actions>
</mat-card>
